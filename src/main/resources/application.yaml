# config cho ứng dụng
# context-path: phục vụ cho microsercice
server:
  port: 8080
  servlet:
    context-path: /identity

# config connect to mysql database
spring:
  datasource: 
    url: "jdbc:mysql://localhost:3306/identity_service"
    username: root
    password: 12345
    #jpa tự động tạo bảng nếu chưa tồn tại
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true