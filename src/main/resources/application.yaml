# config cho ứng dụng
# context-path: phục vụ cho microsercice
server:
  port: 8080
  servlet:
    context-path: /identity

# config connect to mysql database
spring:
  datasource: 
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/identity_service}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:12345}
    #jpa tự động tạo bảng nếu chưa tồn tại
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  signerKey: "c6ab39ff88b61860ae5178545904a31667c3b637bae24a1c1d9e5ca447c445e2"
  valid-duration: 3600 # in seconds
  refreshable-duration: 36000 # in seconds