spring:
  datasource:
    url: jdbc:h2:mem:identity_service;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

jwt:
  signerKey: "test-signing-key-1234567890abcdef"
  valid-duration: 3600
  refreshable-duration: 36000
